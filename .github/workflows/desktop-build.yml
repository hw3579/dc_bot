name: Desktop Build

on:
  pull_request:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform.name }} bundle
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            name: Windows
            artifact_name: windows
          - os: macos-latest
            name: macOS
            artifact_name: macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            app/src-tauri -> target

      - name: Install desktop app dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build Tauri desktop bundles
        working-directory: app
        env:
          CI: "true"
        run: pnpm tauri build

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: options-relay-${{ matrix.platform.artifact_name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/**/*.app.tar.gz
            app/src-tauri/target/release/bundle/**/*.dmg
            app/src-tauri/target/release/bundle/**/*.exe
            app/src-tauri/target/release/bundle/**/*.msi
            app/src-tauri/target/release/bundle/**/*.zip

  release:
    name: Draft GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.zip

  nightly_release:
    name: Publish Nightly Release
    if: github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Remove previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --cleanup-tag -y
          fi

      - name: Publish latest nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s globstar nullglob

          files=(
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.dmg
            release-artifacts/**/*.exe
            release-artifacts/**/*.msi
            release-artifacts/**/*.zip
          )

          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No nightly artifacts found"
            exit 1
          fi

          gh release create nightly "${files[@]}" \
            --title "Nightly Build" \
            --notes "Automated nightly build for ${GITHUB_SHA}" \
            --prerelease \
            --target "${GITHUB_SHA}"