[project]
name = "discord-channel-exporter"
version = "0.1.0"
description = "Export Discord channel history with a bot token"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.11.18,<4",
    "moomoo-api>=10.6.6608,<11",
    "nats-py>=2.14.0,<3",
    "python-dotenv>=1.1.0,<2",
]

[project.scripts]
discord-export = "discord_channel_exporter.cli:main"
discord-filter-orders = "discord_channel_exporter.filter_orders:main"
discord-publish-orders = "discord_channel_exporter.nats_topic:publish_main"
discord-subscribe-topic = "discord_channel_exporter.nats_topic:subscribe_main"
discord-watch-orders = "discord_channel_exporter.watch_orders:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_channel_exporter"]